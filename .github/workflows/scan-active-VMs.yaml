
name: Scan active VMs in subscription (OIDC)

on:
  workflow_dispatch:
    inputs:
      subscriptionId:
        required: false
        type: string
  schedule:
    - cron: "0 3 2 * *"  

permissions:
  id-token: write      # REQUIRED for OIDC token
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Login to Azure using OIDC
      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscriptionId || secrets.AZURE_SUBSCRIPTION_ID }}

      # 3) Ensure Resource Graph CLI extension is available
      - name: Install Resource Graph CLI extension
        run: |
          az extension add --name resource-graph || az extension update --name resource-graph

      # 4) Query Resource Graph to find VMs with power state 'running'
      
      - name: Running VMs
        shell: pwsh
        env:
          TARGET_SUB_ID: ${{ inputs.subscriptionId || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          az account set --subscription $env:TARGET_SUB_ID | Out-Null
      
          # Get VMs with instance view
          $vms = az vm list --show-details --subscription $env:TARGET_SUB_ID --output json | ConvertFrom-Json
      
          # Filter running and select fields
          $running = $vms | Where-Object { $_.powerState -eq 'VM running' } |
             Select-Object @{
              n = 'VM name'; e = { $_.name }
            }, @{
              n = 'Subscription'; e = { $subscriptionName }
            }, @{
              n = 'Resource group'; e = { $_.resourceGroup }
            }, @{
              n = 'Location'; e = { $_.location }
            }, @{
              n = 'Status'; e = { $_.powerState } # e.g., "VM running"
            }, @{
              n = 'OS name'; e = { $_.storageProfile.osDisk.osType } # Windows / Linux
            }, @{
              n = 'Disk size (GB)'; e = { $_.storageProfile.osDisk.diskSizeGb }
            }

      
          $running | ConvertTo-Json -Depth 6 | Out-File active_vms.json -Encoding utf8
      
          # CSV export
          $running | ConvertTo-Csv -NoTypeInformation | Out-File active_vms.csv -Encoding utf8
      
          # Count output variable
          $count = $running.Count
          Write-Output "count=$count" >> $env:GITHUB_OUTPUT
      
          # Preview
          Get-Content active_vms.csv | Select-Object -First 20



      # 5) Upload results (artifacts)
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: vm-inventory-${{ github.run_number }}
          path: |
            active_vms.json
            active_vms.csv
          if-no-files-found: error

      # 6) (Optional) Print summary in job logs
      - name: Summary
        run: |
          echo "Active VM count: ${{ steps.arg.outputs.count }}"
          head -n 20 active_vms.csv || true
