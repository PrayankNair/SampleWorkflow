
name: Scan Azure VMs

on:
  # Manual trigger with optional subscription override
  workflow_dispatch:
    inputs:
      subscriptionId:
        required: false
        type: string
  # 2nd of every month at 03:00 UTC
  schedule:
    - cron: "0 3 2 * *"

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      id-token: write    # required for OIDC
      contents: read

    env:
      # Use the provided input or fall back to the default secret
      TARGET_SUB_ID: ${{ inputs.subscriptionId || secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.TARGET_SUB_ID }}

      
      - name: List VMs and write summary (PowerShell)
        shell: pwsh
        run: |
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          $subName = az account show --query name -o tsv
          $vms = az vm list --show-details --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" | ConvertFrom-Json
      
          "# Azure VM Inventory — $subName" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "**VMs found:** $($vms.Count)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "| VM name | Resource group | Location | Status | OS | Disk (GB) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|---|---|" | Out-File -Append $env:GITHUB_STEP_SUMMARY
      
          foreach ($vm in $vms) {
            $name  = $vm.name
            $rg    = $vm.resourceGroup
            $loc   = $vm.location
            $state = $vm.powerState
            $os    = $vm.storageProfile.osDisk.osType
            $disk  = $vm.storageProfile.osDisk.diskSizeGb
            "| $name | $rg | $loc | $state | $os | $disk |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }
      
